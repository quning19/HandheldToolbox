[project]
name = "frontend-trans-tool"
version = "0.1.0"
description = "Windows frontend toolkit with independent game-library and ES-DE theme converters"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "RetroLibX contributors" }]
dependencies = [
  "lxml>=5.3",
  "platformdirs>=4.3",
  "pydantic>=2.10",
  "pyyaml>=6.0",
  "rich>=13.9",
  "Pillow>=10",
  "typer>=0.15",
]

[project.scripts]
retrolibx = "retrolibx.cli:run"
frontend-trans-tool = "frontend_gui.app:run"
library-converter = "library_converter.__main__:main"
theme-converter = "theme_converter.__main__:main"

[project.optional-dependencies]
desktop = [
  "PySide6==6.12.0; sys_platform == 'win32'",
  "PySide6-Fluent-Widgets==1.11.3; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
  "mypy>=1.14",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retrolibx", "src/frontend_platforms", "src/frontend_devices", "src/frontend_common", "src/library_converter", "src/theme_converter", "src/frontend_gui"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
source = ["retrolibx", "frontend_platforms"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["retrolibx", "frontend_platforms"]

[[tool.mypy.overrides]]
module = ["yaml", "lxml", "lxml.*"]
ignore_missing_imports = true
